<title>dressed.stb</title>
<style>
/* ===================== CONFIG IS BELOW IN <script> ===================== */
:root{
  --paper:#FAF6FE; --ink:#33244A; --ink-2:#7C6C90; --line:#E9DFF3;
  --wine:#8A5BB8; --wine-soft:#E4D0F5; --blush:#E4D0F5;
  --sage:#4F7A56; --sage-soft:#E2EEE2; --amber:#B0771E; --amber-soft:#F7EAD2;
  --red:#B2352E; --red-soft:#F8E1DF;
  --tab-h:64px;
  --serif:-apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  --sans:-apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  color-scheme:light;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px);height:100%}
body{margin:0;height:100%;background:var(--paper);color:var(--ink);font:16px/1.45 var(--sans);-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent}
h1,h2,h3{font-family:var(--serif);font-weight:700;margin:0;letter-spacing:-.02em}
h1{font-size:30px;line-height:1.1}
h2{font-size:22px;line-height:1.15}
h3{font-size:18px}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
input,select,textarea{font:inherit;color:inherit}
a{color:var(--wine)}

/* app shell */
#app{min-height:100%;padding-bottom:calc(var(--tab-h) + env(safe-area-inset-bottom,0px) + 24px)}
.screen{display:none;padding:18px 18px 0}
.screen.on{display:block}
.top{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;margin-bottom:18px}
.top .sub{color:var(--ink-2);font-size:14px;margin-top:4px}
.brand{font-weight:600;font-size:14px;letter-spacing:.04em;text-transform:lowercase;color:var(--wine)}
.sync{width:8px;height:8px;border-radius:50%;background:var(--sage);display:inline-block;margin-left:6px;vertical-align:middle}
.sync.off{background:var(--amber)} .sync.err{background:var(--red)}

/* lists */
.section{margin:22px 0 0}
.section > h2{margin-bottom:8px}
.section .note{color:var(--ink-2);font-size:14px;margin:0 0 8px}
.row{display:flex;align-items:center;gap:12px;width:100%;text-align:left;padding:12px 0;border-bottom:1px solid var(--line);min-height:56px}
.row:last-child{border-bottom:0}
.row .main{flex:1;min-width:0}
.row .t{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .s{color:var(--ink-2);font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .r{text-align:right;flex-shrink:0}
.row .r .t{font-family:var(--serif);font-size:18px}
.swatch{width:10px;height:36px;border-radius:5px;flex-shrink:0;background:var(--line)}
.chip{display:inline-block;font-size:12px;font-weight:600;padding:3px 8px;border-radius:999px;background:var(--line);color:var(--ink-2)}
.chip.in{background:var(--sage-soft);color:var(--sage)}
.chip.out{background:var(--wine-soft);color:var(--wine)}
.chip.booked{background:var(--amber-soft);color:var(--amber)}
.chip.late{background:var(--red-soft);color:var(--red)}
.empty{color:var(--ink-2);padding:22px 0;font-size:15px}
.empty b{color:var(--ink);font-weight:600}

/* today ledger */
.day{display:grid;grid-template-columns:52px 1fr;gap:10px;padding:10px 0;border-bottom:1px solid var(--line)}
.day:last-child{border-bottom:0}
.day .d{font-family:var(--serif);font-size:15px;color:var(--ink-2);padding-top:10px;line-height:1.1}
.day .d b{display:block;color:var(--ink);font-size:22px;font-weight:600}
.day .items{display:flex;flex-direction:column}
.day .items .row{padding:10px 0;min-height:48px}
.day .items .row:not(:last-child){border-bottom:1px dashed var(--line)}
.kind{font-size:11px;font-weight:700;letter-spacing:.02em;padding:2px 6px;border-radius:4px;flex-shrink:0}
.kind.up{background:#E4D0F5;color:var(--ink)} .kind.fit{background:var(--amber-soft);color:var(--amber)} .kind.back{background:var(--sage);color:#fff} .kind.late{background:var(--red);color:#fff}

/* money */
.stat{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:6px 0 4px}
.stat div{padding:14px 14px 12px;border:1px solid var(--line);border-radius:14px}
.stat b{display:block;font-family:var(--serif);font-size:26px;font-weight:600;line-height:1}
.stat span{color:var(--ink-2);font-size:13px}
.stat .warn b{color:var(--wine)}
.monthnav{display:flex;align-items:center;justify-content:space-between;margin-bottom:6px}
.monthnav button{width:44px;height:44px;font-size:22px;color:var(--wine)}
.monthnav h2{text-align:center;flex:1}

/* bars */
.bar{display:grid;grid-template-columns:1fr auto;align-items:center;gap:10px;padding:8px 0}
.bar .lbl{font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bar .track{grid-column:1/3;height:8px;border-radius:4px;background:var(--line);overflow:hidden}
.bar .fill{height:100%;background:#C9A8E8;border-radius:4px}
.bar .v{font-family:var(--serif);font-size:16px;font-weight:600}
.seg{display:flex;border:1px solid var(--line);border-radius:10px;overflow:hidden;margin:0 0 10px}
.seg button{flex:1;padding:9px 0;font-size:14px;color:var(--ink-2)}
.seg button.on{background:#E4D0F5;color:var(--ink)}
.months{display:flex;align-items:flex-end;gap:6px;height:110px;padding:6px 0 0}
.months div{flex:1;background:#E9DFF3;border-radius:4px 4px 0 0;position:relative;min-height:2px}
.months div span{position:absolute;bottom:-20px;left:0;right:0;text-align:center;font-size:11px;color:var(--ink-2)}
.months div i{position:absolute;top:-18px;left:0;right:0;text-align:center;font-style:normal;font-size:12px;font-weight:600}
.months div.cur{background:#C9A8E8}

/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:48px;padding:0 18px;border-radius:12px;font-weight:600;font-size:16px;background:var(--ink);color:var(--paper);width:100%}
.btn.wine{background:#E4D0F5;color:var(--ink)}
.btn.ghost{background:transparent;color:var(--ink);border:1px solid var(--line)}
.btn.sm{height:38px;font-size:14px;padding:0 12px;width:auto;border-radius:10px}
.btn.danger{background:transparent;color:var(--red);border:1px solid var(--line)}
.btn:disabled{opacity:.5}
.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}
.actions .btn{flex:1 1 45%}
.fab{position:fixed;right:18px;bottom:calc(var(--tab-h) + env(safe-area-inset-bottom,0px) + 14px);width:56px;height:56px;border-radius:50%;background:#E4D0F5;color:var(--ink);font-size:30px;line-height:1;box-shadow:0 8px 20px rgba(138,91,184,.3);z-index:5;display:flex;align-items:center;justify-content:center}
.fab span{transform:translateY(-1px)}

/* tabs */
.tabs{position:fixed;left:0;right:0;bottom:0;height:calc(var(--tab-h) + env(safe-area-inset-bottom,0px));padding-bottom:env(safe-area-inset-bottom,0px);display:flex;background:var(--paper);border-top:1px solid var(--line);z-index:6}
.tabs button{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:11px;font-weight:600;color:var(--ink-2)}
.tabs button.on{color:var(--wine)}
.tabs svg{width:24px;height:24px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}

/* sheet (modal) */
.sheet-bg{position:fixed;inset:0;background:rgba(51,36,74,.4);z-index:20;display:none;align-items:flex-end}
.sheet-bg.on{display:flex}
.sheet{width:100%;max-height:92%;overflow:auto;background:var(--paper);border-radius:22px 22px 0 0;padding:10px 18px calc(24px + env(safe-area-inset-bottom,0px));animation:up .22s ease-out}
@keyframes up{from{transform:translateY(40px);opacity:.6}to{transform:none;opacity:1}}
@media (prefers-reduced-motion:reduce){.sheet{animation:none}}
.grip{width:38px;height:4px;border-radius:2px;background:var(--line);margin:0 auto 14px}
.sheet h2{margin-bottom:12px}
.field{margin-bottom:12px}
.field label{display:block;font-size:13px;color:var(--ink-2);margin-bottom:4px}
.field input,.field select,.field textarea{width:100%;height:46px;padding:0 12px;border:1px solid var(--line);border-radius:10px;background:transparent;-webkit-appearance:none;appearance:none}
.field textarea{height:auto;min-height:72px;padding:10px 12px}
.field input:focus,.field select:focus,.field textarea:focus{outline:2px solid var(--wine);outline-offset:-1px}
.field .hint{font-size:13px;color:var(--wine);margin-top:4px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.kv{display:grid;grid-template-columns:auto 1fr;gap:6px 14px;font-size:15px;margin:10px 0}
.kv span{color:var(--ink-2)}
.hist{border-top:1px solid var(--line);margin-top:14px;padding-top:6px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(var(--tab-h) + env(safe-area-inset-bottom,0px) + 20px);background:var(--ink);color:var(--paper);padding:10px 16px;border-radius:999px;font-size:14px;z-index:30;opacity:0;transition:opacity .2s;pointer-events:none}
.toast.on{opacity:1}
.linkbtn{color:var(--wine);font-weight:600;font-size:15px}
</style>
</head>

    <div id="money-body"></div>
  </section>

  <!-- TRENDS -->
  <section class="screen" id="s-trends">
    <div class="top"><div><div class="brand">dressed.stb</div><h1>Trends</h1></div></div>
    <div id="trend-body"></div>
  </section>
</div>

<button class="fab" onclick="openBooking(null)" aria-label="New booking"><span>+</span></button>

<nav class="tabs">
  <button class="on" data-s="today" onclick="go('today')"><svg viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/></svg>Today</button>
  <button data-s="dresses" onclick="go('dresses')"><svg viewBox="0 0 24 24"><path d="M9 3l3 3 3-3M9 3v4a3 3 0 0 0 6 0V3M12 7l-6 14h12L12 7z"/></svg>Dresses</button>
  <button data-s="money" onclick="go('money')"><svg viewBox="0 0 24 24"><rect x="3" y="6" width="18" height="12" rx="2"/><circle cx="12" cy="12" r="2.5"/></svg>Money</button>
  <button data-s="trends" onclick="go('trends')"><svg viewBox="0 0 24 24"><path d="M4 19V5M4 19h16M8 15l4-5 3 3 5-7"/></svg>Trends</button>
</nav>

<div class="sheet-bg" id="sheet-bg" onclick="if(event.target===this)closeSheet()">
  <div class="sheet" id="sheet"><div class="grip"></div><div id="sheet-body"></div></div>
</div>
<div class="toast" id="toast"></div>

<script>
/* ============================================================
   CONFIG — the only two lines to change after deploying the sheet
   ============================================================ */
const CONFIG = {
  API_URL: "https://script.google.com/macros/s/AKfycbwSTkUCBO7sfgFRZswQrSwM2H796DfewT0_Najey7OmY37hRVRfq5RohsbU4azmVLYYng/exec",              // paste the Apps Script web-app URL here. Empty = demo mode (data stays on this phone only)
  TOKEN: "oywXOF0fa3Jr2FFvmI6p8jzq"        // must match SECRET in Code.gs
};

/* ---------- state & storage ---------- */
const LS = "dressed.v1";
let S = { dresses:[], bookings:[], enquiries:[], settings:{} };
let queue = JSON.parse(localStorage.getItem(LS+".q")||"[]");
let syncState = CONFIG.API_URL ? "off" : "ok";
try{ const c=localStorage.getItem(LS); if(c) S=Object.assign(S, JSON.parse(c)); }catch(e){}
const save = ()=>{ try{ localStorage.setItem(LS, JSON.stringify(S)); localStorage.setItem(LS+".q", JSON.stringify(queue)); }catch(e){} };
const uid = ()=> Date.now().toString(36)+Math.random().toString(36).slice(2,6);
const R = n => "R"+Math.round(n||0).toLocaleString("en-ZA");
const today = ()=> new Date().toISOString().slice(0,10);
const addDays = (d,n)=>{ const x=new Date(d+"T12:00:00"); x.setDate(x.getDate()+n); return x.toISOString().slice(0,10); };
const fmt = d => d ? new Date(d+"T12:00:00").toLocaleDateString("en-ZA",{day:"numeric",month:"short"}) : "";
const fmtL = d => d ? new Date(d+"T12:00:00").toLocaleDateString("en-ZA",{weekday:"short",day:"numeric",month:"long"}) : "";
const esc = s => String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const MON = ["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];

/* ---------- backend ---------- */
async function loadAll(){
  if(!CONFIG.API_URL) return;
  try{
    const r = await fetch(CONFIG.API_URL+"?token="+encodeURIComponent(CONFIG.TOKEN)+"&_="+Date.now());
    const j = await r.json();
    if(j.error) throw new Error(j.error);
    // merge: server wins unless we have queued local edits for that row
    const pending = new Set(queue.map(q=>q.row.id));
    for(const t of ["dresses","bookings","enquiries"]){
      const local = S[t].filter(x=>pending.has(x.id));
      S[t] = (j[t]||[]).filter(x=>!pending.has(x.id)).concat(local);
    }
    if(j.settings && j.settings.length && !pending.has("main")) S.settings = j.settings[0];
    syncState="ok"; save(); render();
  }catch(e){ syncState="err"; render(); }
  flush();
}
function put(table,row){
  row.updatedAt = new Date().toISOString();
  if(table==="settings"){ S.settings=row; }
  else { const i = S[table].findIndex(x=>x.id===row.id); if(i>=0) S[table][i]=row; else S[table].push(row); }
  if(CONFIG.API_URL){ queue = queue.filter(q=>!(q.table===table&&q.row.id===row.id)); queue.push({table,row}); }
  save(); render(); flush();
}
let flushing=false;
async function flush(){
  if(!CONFIG.API_URL || flushing || !queue.length) return;
  flushing=true;
  while(queue.length){
    const op = queue[0];
    try{
      const r = await fetch(CONFIG.API_URL,{method:"POST",headers:{"Content-Type":"text/plain"},body:JSON.stringify({token:CONFIG.TOKEN,table:op.table,row:op.row})});
      const j = await r.json(); if(!j.ok) throw new Error(j.error||"write failed");
      queue.shift(); save(); syncState="ok";
    }catch(e){ syncState="off"; break; }
  }
  flushing=false; renderSync();
}

/* ---------- derived ---------- */
const active = b => b.status!=="cancelled";
function bState(b){
  if(b.status==="cancelled") return "cancelled";
  if(b.returnedAt) return "done";
  if(b.pickedUpAt || b.pickup<=today()) return b.return<today() ? "late" : "out";
  return "booked";
}
function dState(d){
  const bs = S.bookings.filter(b=>b.dressId===d.id && active(b));
  if(bs.some(b=>bState(b)==="late")) return "late";
  if(bs.some(b=>bState(b)==="out")) return "out";
  if(bs.some(b=>bState(b)==="booked" && b.pickup<=addDays(today(),14))) return "booked";
  return "in";
}
const dressName = id => (S.dresses.find(d=>d.id===id)||{}).name||"—";
const dressOf = id => S.dresses.find(d=>d.id===id);
const overlaps = (b,pickup,ret) => active(b) && !b.returnedAt && b.pickup<=ret && b.return>=pickup;
const owed = b => Math.max(0,(+b.price||0)-(+b.paid||0));

/* ---------- navigation ---------- */
let screen="today", editingId="";
function go(s){ screen=s; document.querySelectorAll(".screen").forEach(x=>x.classList.toggle("on",x.id==="s-"+s)); document.querySelectorAll(".tabs button").forEach(x=>x.classList.toggle("on",x.dataset.s===s)); window.scrollTo(0,0); render(); }
function render(){ renderSync(); ({today:renderToday,dresses:renderDresses,money:renderMoney,trends:renderTrends})[screen](); }
function renderSync(){ const el=document.getElementById("today-sub"); if(!el) return; const msg = !CONFIG.API_URL ? "demo mode — data only on this phone" : syncState==="ok" ? "synced" : syncState==="off" ? (queue.length+" change"+(queue.length!==1?"s":"")+" waiting to sync") : "can't reach the sheet"; el.innerHTML = fmtL(today())+' <span class="sync '+(syncState==="ok"?"":syncState)+'"></span> <span style="font-size:13px">'+msg+"</span>"; }
function toast(m){ const t=document.getElementById("toast"); t.textContent=m; t.classList.add("on"); clearTimeout(t._t); t._t=setTimeout(()=>t.classList.remove("on"),1800); }

/* ---------- TODAY ---------- */
function renderToday(){
  const t=today(), horizon=addDays(t,14);
  const bs = S.bookings.filter(active);
  const late = bs.filter(b=>bState(b)==="late");
  const ev = [];
  for(const b of bs){
    const st=bState(b);
    if(st==="booked" && b.fittingDate && b.fittingDate>=t && b.fittingDate<=horizon) ev.push({d:b.fittingDate,k:"fit",b});
    if(st==="booked" && b.pickup>=t && b.pickup<=horizon) ev.push({d:b.pickup,k:"up",b});
    if((st==="out") && b.return>=t && b.return<=horizon) ev.push({d:b.return,k:"back",b});
    if(st==="booked" && b.pickup>=t && b.pickup<=horizon && b.return<=horizon) ev.push({d:b.return,k:"back",b});
  }
  ev.sort((a,b)=>a.d.localeCompare(b.d)||({fit:0,up:1,back:2}[a.k]-{fit:0,up:1,back:2}[b.k]));
  const days={}; ev.forEach(e=>(days[e.d]=days[e.d]||[]).push(e));
  const unpaid = bs.filter(b=>owed(b)>0 && bState(b)!=="booked");
  const enq = S.enquiries.filter(e=>!e.bookingId && !e.closed && e.eventDate>=addDays(t,-1)).sort((a,b)=>a.eventDate.localeCompare(b.eventDate));
  let h="";
  if(late.length){ h+='<div class="section"><h2 style="color:var(--red)">Overdue</h2>'+late.map(b=>rowB(b,"late")).join("")+"</div>"; }
  h+='<div class="section"><h2>Next two weeks</h2>';
  if(!ev.length) h+='<div class="empty">Nothing due. <b>Tap + to add a booking.</b></div>';
  else h+=Object.keys(days).map(d=>{ const dt=new Date(d+"T12:00:00"); return '<div class="day"><div class="d">'+dt.toLocaleDateString("en-ZA",{weekday:"short"})+'<b>'+dt.getDate()+'</b>'+MON[dt.getMonth()]+'</div><div class="items">'+days[d].map(e=>'<button class="row" onclick="openBookingView(\''+e.b.id+'\')"><span class="kind '+e.k+'">'+({up:"OUT",back:"BACK",fit:"FIT"}[e.k])+'</span><div class="main"><div class="t">'+esc(dressName(e.b.dressId))+'</div><div class="s">'+esc(e.b.client)+(e.k==="fit"&&e.b.fittingTime?' · '+e.b.fittingTime:'')+(owed(e.b)>0?' · owes '+R(owed(e.b)):'')+'</div></div></button>').join("")+'</div></div>';}).join("");
  h+="</div>";
  h+='<div class="section"><h2>Enquiries <button class="linkbtn" style="font-size:14px;margin-left:8px" onclick="openEnquiry()">Log one</button></h2>';
  h+= enq.length ? enq.map(e=>'<button class="row" onclick="enquiryActions(\''+e.id+'\')"><div class="main"><div class="t">'+esc(e.client)+' · '+esc(e.dressId?dressName(e.dressId):e.dressText||"any")+'</div><div class="s">for '+fmt(e.eventDate)+(e.phone?' · '+esc(e.phone):'')+'</div></div><div class="r"><span class="chip">asked</span></div></button>').join("") : '<div class="empty">No open enquiries.</div>';
  h+="</div>";
  if(unpaid.length){ h+='<div class="section"><h2>Still owing</h2>'+unpaid.map(b=>rowB(b,"owe")).join("")+"</div>"; }
  document.getElementById("today-body").innerHTML=h;
}
function rowB(b,mode){
  const st=bState(b);
  const right = mode==="owe" ? '<div class="t">'+R(owed(b))+'</div>' : '<span class="chip '+st+'">'+({late:"overdue",out:"out",booked:"booked",done:"returned",cancelled:"cancelled"}[st])+'</span>';
  return '<button class="row" onclick="openBookingView(\''+b.id+'\')"><div class="main"><div class="t">'+esc(b.client)+'</div><div class="s">'+esc(dressName(b.dressId))+' · '+fmt(b.pickup)+' – '+fmt(b.return)+'</div></div><div class="r">'+right+'</div></button>';
}

/* ---------- DRESSES ---------- */
function renderDresses(){
  const ds = S.dresses.filter(d=>!d.retired).map(d=>({d,st:dState(d)}));
  const order={late:0,out:1,booked:2,in:3};
  ds.sort((a,b)=>order[a.st]-order[b.st]||a.d.name.localeCompare(b.d.name));
  document.getElementById("dress-sub").textContent = ds.filter(x=>x.st==="in").length+" of "+ds.length+" available now";
  document.getElementById("dress-body").innerHTML = ds.length ? ds.map(({d,st})=>{
    const cur = S.bookings.find(b=>b.dressId===d.id && active(b) && (bState(b)==="out"||bState(b)==="late"));
    const next = S.bookings.filter(b=>b.dressId===d.id && bState(b)==="booked").sort((a,b)=>a.pickup.localeCompare(b.pickup))[0];
    const sub = cur ? "with "+cur.client+" · back "+fmt(cur.return) : next ? "next "+fmt(next.pickup)+" · "+next.client : "in the flat";
    return '<button class="row" onclick="openDress(\''+d.id+'\')"><span class="swatch" style="background:'+esc(d.colour||"var(--line)")+'"></span><div class="main"><div class="t">'+esc(d.name)+'</div><div class="s">'+esc(sub)+'</div></div><div class="r"><span class="chip '+st+'">'+({late:"overdue",out:"out",booked:"booked",in:"in"}[st])+'</span><div class="s">'+R(d.price)+'</div></div></button>';
  }).join("") : '<div class="empty">No dresses yet. <b>Tap Add.</b></div>';
}

/* ---------- MONEY ---------- */
let mOff=0;
function renderMoney(){
  const base=new Date(); base.setMonth(base.getMonth()+mOff);
  const ym = base.getFullYear()+"-"+String(base.getMonth()+1).padStart(2,"0");
  const bs = S.bookings.filter(b=>active(b)&&b.pickup.startsWith(ym));
  const income = bs.reduce((s,b)=>s+(+b.price||0),0);
  const received = bs.reduce((s,b)=>s+(+b.paid||0),0);
  const allOwed = S.bookings.filter(b=>active(b)&&owed(b)>0).sort((a,b)=>a.pickup.localeCompare(b.pickup));
  const owedTotal = allOwed.reduce((s,b)=>s+owed(b),0);
  let h='<div class="monthnav"><button onclick="mOff--;render()">‹</button><h2>'+MON[base.getMonth()]+' '+base.getFullYear()+'</h2><button onclick="mOff++;render()">›</button></div>';
  h+='<div class="stat"><div><b>'+R(income)+'</b><span>'+bs.length+' rental'+(bs.length!==1?'s':'')+' booked</span></div><div><b>'+R(received)+'</b><span>received</span></div></div>';
  h+='<div class="section"><h2>This month</h2>'+(bs.length?bs.sort((a,b)=>a.pickup.localeCompare(b.pickup)).map(b=>'<button class="row" onclick="openBookingView(\''+b.id+'\')"><div class="main"><div class="t">'+esc(b.client)+'</div><div class="s">'+esc(dressName(b.dressId))+' · '+fmt(b.pickup)+'</div></div><div class="r"><div class="t">'+R(b.price)+'</div><div class="s">'+(owed(b)>0?'owes '+R(owed(b)):'paid')+'</div></div></button>').join(""):'<div class="empty">No rentals this month.</div>')+'</div>';
  h+='<div class="section"><h2>Owed to you <span style="font-weight:400;color:var(--wine)">'+R(owedTotal)+'</span></h2>'+(allOwed.length?allOwed.map(b=>rowB(b,"owe")).join(""):'<div class="empty">Everyone has paid.</div>')+'</div>';
  document.getElementById("money-body").innerHTML=h;
}

/* ---------- TRENDS ---------- */
let tRange=6, tMetric="count";
function renderTrends(){
  const since = tRange ? addDays(today(),-30*tRange) : "0000";
  const bs = S.bookings.filter(b=>active(b)&&b.pickup>=since&&b.pickup<=today());
  const per={};
  for(const b of bs){ per[b.dressId]=per[b.dressId]||{n:0,rev:0}; per[b.dressId].n++; per[b.dressId].rev+=+b.price||0; }
  const rows = S.dresses.filter(d=>!d.retired).map(d=>({d,n:(per[d.id]||{}).n||0,rev:(per[d.id]||{}).rev||0})).sort((a,b)=>tMetric==="count"?b.n-a.n||b.rev-a.rev:b.rev-a.rev);
  const max = Math.max(1,...rows.map(r=>tMetric==="count"?r.n:r.rev));
  let h='<div class="seg">'+[3,6,12,0].map(n=>'<button class="'+(tRange===n?'on':'')+'" onclick="tRange='+n+';render()">'+(n?'Last '+n+' mo':'All')+'</button>').join("")+'</div>';
  h+='<div class="seg">'+[["count","Rentals"],["rev","Revenue"]].map(([k,l])=>'<button class="'+(tMetric===k?'on':'')+'" onclick="tMetric=\''+k+'\';render()">'+l+'</button>').join("")+'</div>';
  // per month
  const months=[]; for(let i=5;i>=0;i--){ const d=new Date(); d.setDate(1); d.setMonth(d.getMonth()-i); const ym=d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0"); const mb=S.bookings.filter(b=>active(b)&&b.pickup.startsWith(ym)); months.push({l:MON[d.getMonth()],v:tMetric==="count"?mb.length:mb.reduce((s,b)=>s+(+b.price||0),0),cur:i===0}); }
  const mmax=Math.max(1,...months.map(m=>m.v));
  h+='<div class="section"><h2>By month</h2><div class="months">'+months.map(m=>'<div class="'+(m.cur?'cur':'')+'" style="height:'+Math.max(2,Math.round(m.v/mmax*100))+'%"><i>'+(m.v?(tMetric==="count"?m.v:R(m.v)):'')+'</i><span>'+m.l+'</span></div>').join("")+'</div><div style="height:22px"></div></div>';
  h+='<div class="section"><h2>By dress</h2><p class="note">'+(bs.length?bs.length+' rentals counted':'Trends fill in as bookings get logged.')+'</p>'+rows.map(r=>{ const v=tMetric==="count"?r.n:r.rev; return '<div class="bar"><div class="lbl">'+esc(r.d.name)+'</div><div class="v">'+(tMetric==="count"?v:R(v))+'</div><div class="track"><div class="fill" style="width:'+Math.round(v/max*100)+'%"></div></div></div>'; }).join("")+'</div>';
  document.getElementById("trend-body").innerHTML=h;
}

/* ---------- SHEETS ---------- */
function openSheet(html){ document.getElementById("sheet-body").innerHTML=html; document.getElementById("sheet-bg").classList.add("on"); document.getElementById("sheet").scrollTop=0; }
function closeSheet(){ document.getElementById("sheet-bg").classList.remove("on"); }
const F=(id,label,type,val,extra="")=>'<div class="field"><label for="'+id+'">'+label+'</label><input id="'+id+'" type="'+type+'" value="'+esc(val)+'" '+extra+'></div>';
const V=id=>document.getElementById(id).value.trim();

/* dress add/edit */
function openDress(id){
  const d = id ? dressOf(id) : {name:"",price:"",colour:"#7A1F3D",notes:""};
  const hist = id ? S.bookings.filter(b=>b.dressId===id&&active(b)).sort((a,b)=>b.pickup.localeCompare(a.pickup)) : [];
  openSheet('<h2>'+(id?esc(d.name):"New dress")+'</h2>'+
    F("d-name","Name (colour + label, e.g. Pink Peppermayo)","text",d.name)+
    '<div class="two">'+F("d-price","Rental price (R)","number",d.price,'inputmode="numeric"')+'<div class="field"><label for="d-colour">Colour</label><input id="d-colour" type="color" value="'+esc(d.colour||"#7A1F3D")+'" style="padding:4px;height:46px"></div></div>'+
    F("d-notes","Size / notes","text",d.notes||"")+
    '<div class="actions"><button class="btn" onclick="saveDress(\''+(id||"")+'\')">Save</button>'+(id?'<button class="btn danger" onclick="retireDress(\''+id+'\')">Remove</button>':'')+'</div>'+
    (id?'<div class="hist"><h3>History · '+hist.length+' rental'+(hist.length!==1?'s':'')+' · '+R(hist.reduce((s,b)=>s+(+b.price||0),0))+'</h3>'+(hist.length?hist.map(b=>rowB(b)).join(""):'<div class="empty">Not rented yet.</div>')+'</div>':''));
}
function saveDress(id){
  const name=V("d-name"); if(!name) return toast("Give the dress a name");
  const d = id ? dressOf(id) : {id:uid(),createdAt:today()};
  Object.assign(d,{name,price:+V("d-price")||0,colour:V("d-colour"),notes:V("d-notes")});
  put("dresses",d); closeSheet(); toast("Saved");
}
function retireDress(id){ if(!confirm("Remove this dress from the list? Its history is kept.")) return; const d=dressOf(id); d.retired=true; put("dresses",d); closeSheet(); }

/* booking add/edit */
function openBooking(id, prefill){
  editingId=id||"";
  const b = id ? S.bookings.find(x=>x.id===id) : Object.assign({dressId:"",client:"",phone:"",eventDate:"",pickup:"",return:"",price:"",paid:0,notes:"",fittingDate:"",fittingTime:""},prefill||{});
  const opts = S.dresses.filter(d=>!d.retired).sort((a,b)=>a.name.localeCompare(b.name)).map(d=>'<option value="'+d.id+'" '+(d.id===b.dressId?'selected':'')+'>'+esc(d.name)+' — '+R(d.price)+'</option>').join("");
  openSheet('<h2>'+(id?"Edit booking":"New booking")+'</h2>'+
    '<div class="field"><label for="b-dress">Dress</label><select id="b-dress" onchange="dressPicked()"><option value="">Choose a dress</option>'+opts+'</select><div class="hint" id="b-clash"></div></div>'+
    F("b-client","Client name","text",b.client)+F("b-phone","Phone","tel",b.phone)+
    F("b-event","Event date","date",b.eventDate,'onchange="eventPicked()"')+
    '<div class="two">'+F("b-pickup","Pick up","date",b.pickup,'onchange="checkClash()"')+F("b-return","Return","date",b.return,'onchange="checkClash()"')+'</div>'+
    '<div class="two">'+F("b-fitdate","Fitting date (optional)","date",b.fittingDate||"")+F("b-fittime","Fitting time","time",b.fittingTime||"")+'</div>'+
    '<div class="two">'+F("b-price","Price (R)","number",b.price,'inputmode="numeric"')+F("b-paid","Paid so far (R)","number",b.paid,'inputmode="numeric"')+'</div>'+
    F("b-notes","Notes (fitting time, alterations…)","text",b.notes||"")+
    '<div class="actions"><button class="btn wine" onclick="saveBooking(\''+(id||"")+'\''+(prefill&&prefill._enq?',\''+prefill._enq+'\'':'')+')">'+(id?"Save changes":"Save booking")+'</button></div>');
  if(!id && b.dressId) dressPicked(); else checkClash();
}
function dressPicked(){ const d=dressOf(V("b-dress")); if(d) document.getElementById("b-price").value=d.price||""; checkClash(); }
function eventPicked(){ const e=V("b-event"); if(!e) return; if(!V("b-pickup")) document.getElementById("b-pickup").value=addDays(e,-1); if(!V("b-return")) document.getElementById("b-return").value=addDays(e,2); checkClash(); }
function checkClash(){ const el=document.getElementById("b-clash"); const id=V("b-dress"), p=V("b-pickup"), r=V("b-return"); el.textContent=""; if(!id||!p||!r) return; const c=S.bookings.find(b=>b.dressId===id&&b.id!==editingId&&overlaps(b,p,r)); if(c) el.textContent="Careful: this dress is with "+c.client+" "+fmt(c.pickup)+" – "+fmt(c.return); }
function saveBooking(id, enqId){
  const dressId=V("b-dress"), client=V("b-client"), pickup=V("b-pickup"), ret=V("b-return");
  if(!dressId) return toast("Choose a dress"); if(!client) return toast("Who is it for?"); if(!pickup||!ret) return toast("Set pick up and return dates"); if(ret<pickup) return toast("Return is before pick up");
  const b = id ? S.bookings.find(x=>x.id===id) : {id:uid(),createdAt:today(),status:"booked"};
  Object.assign(b,{dressId,client,phone:V("b-phone"),eventDate:V("b-event"),pickup,return:ret,price:+V("b-price")||0,paid:+V("b-paid")||0,notes:V("b-notes"),fittingDate:V("b-fitdate"),fittingTime:V("b-fittime")});
  put("bookings",b);
  if(enqId){ const e=S.enquiries.find(x=>x.id===enqId); if(e){ e.bookingId=b.id; put("enquiries",e);} }
  closeSheet(); toast(id?"Saved":"Booked");
}
function openBookingView(id){
  const b=S.bookings.find(x=>x.id===id); const st=bState(b); const d=dressOf(b.dressId)||{};
  const label={booked:"Booked",out:"Out",late:"Overdue",done:"Returned",cancelled:"Cancelled"}[st];
  openSheet('<h2>'+esc(b.client)+' <span class="chip '+st+'" style="vertical-align:middle">'+label+'</span></h2>'+
    '<div class="kv"><span>Dress</span><div>'+esc(d.name||"—")+'</div><span>Event</span><div>'+fmtL(b.eventDate)+'</div>'+(b.fittingDate?'<span>Fitting</span><div>'+fmtL(b.fittingDate)+(b.fittingTime?' at '+b.fittingTime:'')+'</div>':'')+'<span>Pick up</span><div>'+fmtL(b.pickup)+(b.pickedUpAt?' ✓':'')+'</div><span>Return</span><div>'+fmtL(b.return)+(b.returnedAt?' ✓ '+fmt(b.returnedAt):'')+'</div><span>Price</span><div>'+R(b.price)+' · paid '+R(b.paid)+(owed(b)>0?' · <b style="color:var(--wine)">owes '+R(owed(b))+'</b>':'')+'</div>'+(b.phone?'<span>Phone</span><div><a href="tel:'+esc(b.phone)+'">'+esc(b.phone)+'</a></div>':'')+(b.notes?'<span>Notes</span><div>'+esc(b.notes)+'</div>':'')+'</div>'+
    '<div class="actions">'+
    (st==="booked"?'<button class="btn wine" onclick="mark(\''+id+'\',\'pickedUpAt\')">Picked up</button>':'')+
    ((st==="out"||st==="late")?'<button class="btn wine" onclick="mark(\''+id+'\',\'returnedAt\')">Returned</button>':'')+
    (owed(b)>0?'<button class="btn" onclick="markPaid(\''+id+'\')">Paid '+R(owed(b))+'</button>':'')+
    '<button class="btn ghost" onclick="openMessage(\''+id+'\')">Message</button>'+
    '<button class="btn ghost" onclick="openBooking(\''+id+'\')">Edit</button>'+
    (st!=="cancelled"&&st!=="done"?'<button class="btn danger" onclick="cancelBooking(\''+id+'\')">Cancel booking</button>':'')+
    '</div>');
}
function mark(id,k){ const b=S.bookings.find(x=>x.id===id); b[k]=today(); put("bookings",b); openBookingView(id); toast(k==="returnedAt"?"Back in the flat":"Out the door"); }
function markPaid(id){ const b=S.bookings.find(x=>x.id===id); b.paid=+b.price||0; put("bookings",b); openBookingView(id); toast("Paid in full"); }
function cancelBooking(id){ if(!confirm("Cancel this booking?")) return; const b=S.bookings.find(x=>x.id===id); b.status="cancelled"; put("bookings",b); closeSheet(); }

/* messages */
function openMessage(id){
  const b=S.bookings.find(x=>x.id===id); const s=S.settings;
  const fit = "You are booked for a fitting at dressed.stb\nDate of fitting: "+(b.fittingDate?fmtL(b.fittingDate):"")+"\nTime of fitting: "+(b.fittingTime||"")+"\nAddress: "+(s.address||"")+"\n"+(s.mapLink||"")+"\n\nPlease message us when you have arrived at the pedestrian gate next to the car gate so that we can come and let you in!";
  const book = "Dress: "+dressName(b.dressId)+"\nPrice: "+R(b.price)+"\nDate of booking: "+fmt(b.eventDate)+"\nPick up date: "+fmt(b.pickup)+"\nReturn date: "+fmt(b.return)+"\n\nPlease be in contact for pick up and drop off times, thank you for booking with us!"+(s.payment?"\n\nPayment:\n"+s.payment:"");
  const wa = t => "https://wa.me/"+(b.phone||"").replace(/\D/g,"").replace(/^0/,"27")+"?text="+encodeURIComponent(t);
  openSheet('<h2>Message '+esc(b.client)+'</h2><div class="field"><label>Fitting confirmation</label><textarea id="m1" rows="6">'+esc(fit)+'</textarea></div><div class="actions"><button class="btn sm ghost" onclick="copyT(\'m1\')">Copy</button>'+(b.phone?'<a class="btn sm wine" href="'+wa(fit)+'" target="_blank" rel="noopener" onclick="this.href=\''+"https://wa.me/"+(b.phone||"").replace(/\D/g,"").replace(/^0/,"27")+'?text=\'+encodeURIComponent(document.getElementById(\'m1\').value)">WhatsApp</a>':'')+'</div>'+
    '<div class="field" style="margin-top:18px"><label>Booking confirmation</label><textarea id="m2" rows="9">'+esc(book)+'</textarea></div><div class="actions"><button class="btn sm ghost" onclick="copyT(\'m2\')">Copy</button>'+(b.phone?'<a class="btn sm wine" href="'+wa(book)+'" target="_blank" rel="noopener" onclick="this.href=\''+"https://wa.me/"+(b.phone||"").replace(/\D/g,"").replace(/^0/,"27")+'?text=\'+encodeURIComponent(document.getElementById(\'m2\').value)">WhatsApp</a>':'')+'</div>'+
    '<p class="note" style="color:var(--ink-2);font-size:13px;margin-top:14px">Edit the text before sending. Address and payment details come from Settings.</p>');
}
function copyT(id){ const t=document.getElementById(id); t.select(); navigator.clipboard?.writeText(t.value).then(()=>toast("Copied")); }

/* enquiries */
function openEnquiry(){
  const opts=S.dresses.filter(d=>!d.retired).sort((a,b)=>a.name.localeCompare(b.name)).map(d=>'<option value="'+d.id+'">'+esc(d.name)+'</option>').join("");
  openSheet('<h2>Log enquiry</h2>'+F("e-client","Name","text","")+F("e-phone","Phone (optional)","tel","")+'<div class="field"><label for="e-dress">Dress</label><select id="e-dress"><option value="">Not sure yet</option>'+opts+'</select></div>'+F("e-event","Event date","date","")+'<div class="actions"><button class="btn" onclick="saveEnquiry()">Save</button></div>');
}
function saveEnquiry(){ const client=V("e-client"), ev=V("e-event"); if(!client||!ev) return toast("Name and event date"); put("enquiries",{id:uid(),createdAt:today(),client,phone:V("e-phone"),dressId:V("e-dress"),eventDate:ev}); closeSheet(); toast("Logged"); }
function enquiryActions(id){
  const e=S.enquiries.find(x=>x.id===id);
  openSheet('<h2>'+esc(e.client)+'</h2><div class="kv"><span>Wants</span><div>'+esc(e.dressId?dressName(e.dressId):"not sure yet")+'</div><span>For</span><div>'+fmtL(e.eventDate)+'</div>'+(e.phone?'<span>Phone</span><div><a href="tel:'+esc(e.phone)+'">'+esc(e.phone)+'</a></div>':'')+'</div><div class="actions"><button class="btn wine" onclick="openBooking(null,{dressId:\''+esc(e.dressId)+'\',client:\''+esc(e.client)+'\',phone:\''+esc(e.phone||"")+'\',eventDate:\''+e.eventDate+'\',pickup:\''+addDays(e.eventDate,-1)+'\',return:\''+addDays(e.eventDate,2)+'\',price:'+((dressOf(e.dressId)||{}).price||0)+',_enq:\''+id+'\'})">Make it a booking</button><button class="btn danger" onclick="closeEnquiry(\''+id+'\')">Didn\'t book</button></div>');
}
function closeEnquiry(id){ const e=S.enquiries.find(x=>x.id===id); e.closed=today(); put("enquiries",e); closeSheet(); }

/* settings */
function openSettings(){
  const s=S.settings;
  openSheet('<h2>Settings</h2>'+F("st-address","Fitting address","text",s.address||"")+F("st-map","Map link","url",s.mapLink||"")+'<div class="field"><label for="st-pay">Payment details (goes at the end of booking messages)</label><textarea id="st-pay" rows="4">'+esc(s.payment||"")+'</textarea></div>'+
    '<div class="actions"><button class="btn" onclick="saveSettings()">Save</button></div>'+
    '<p class="note" style="color:var(--ink-2);font-size:13px;margin-top:16px">'+(CONFIG.API_URL?'Connected to your Google Sheet. ':'Demo mode: nothing leaves this phone. ')+'Add this page to your home screen to use it like an app.</p>'+
    '<div class="actions">'+(S.dresses.length?'<button class="btn ghost" onclick="dedupe()">Remove duplicate entries</button>':'<button class="btn ghost" onclick="seedDresses()">Load the data from the notes</button>')+'</div>');
}
function dedupe(){
  let n=0;
  const seenE=new Set(); S.enquiries.filter(e=>!e.closed&&!e.bookingId).sort((a,b)=>a.createdAt.localeCompare(b.createdAt)).forEach(e=>{ const k=[e.client.toLowerCase(),e.dressId,e.dressText,e.eventDate].join("|"); if(seenE.has(k)){ e.closed=today(); e.dup=true; put("enquiries",e); n++; } else seenE.add(k); });
  const seenB=new Set(); S.bookings.filter(active).sort((a,b)=>a.createdAt.localeCompare(b.createdAt)).forEach(b=>{ const k=[b.client.toLowerCase(),b.dressId,b.pickup].join("|"); if(seenB.has(k)){ b.status="cancelled"; b.dup=true; put("bookings",b); n++; } else seenB.add(k); });
  const seenD=new Set(); S.dresses.filter(d=>!d.retired).sort((a,b)=>a.createdAt.localeCompare(b.createdAt)).forEach(d=>{ const k=d.name.toLowerCase(); if(seenD.has(k)){ const keep=S.dresses.find(x=>!x.retired&&x.name.toLowerCase()===k&&x.id!==d.id); S.bookings.filter(b=>b.dressId===d.id).forEach(b=>{b.dressId=keep.id;put("bookings",b);}); S.enquiries.filter(e=>e.dressId===d.id).forEach(e=>{e.dressId=keep.id;put("enquiries",e);}); d.retired=true; put("dresses",d); n++; } else seenD.add(k); });
  closeSheet(); toast(n?"Removed "+n+" duplicate"+(n!==1?"s":""):"No duplicates found");
}
function saveSettings(){ const s=S.settings; Object.assign(s,{id:"main",address:V("st-address"),mapLink:V("st-map"),payment:V("st-pay")}); put("settings",s); closeSheet(); toast("Saved"); }
function seedDresses(){
  // Seeded from the girls' notes of 24 Sept 2026. Prices are placeholders (R350) — none were recorded.
  const P=350, T=today();
  const names=[["Black House of CB","#111111"],["Black Oh Polly","#111111"],["Black Forever New","#111111"],["Black with pearls","#222222"],["Brown Forever New","#6B4A2F"],["Brown with scarf","#7A5636"],["Pink with scarf","#E8A0B4"],["Pink Peppermayo","#F2A7BC"],["Purple Forever New","#6E4B9E"],["Maroon House of CB","#6B1E2E"],["Red Mango","#C1272D"],["Silver Mango","#B8BCC4"],["Blue Zara","#2E5AAC"],["Green MD dress","#3D6B4F"]];
  if(S.dresses.length) return toast("Data already loaded");
  const rows=[]; const D={}; names.forEach(([name,colour])=>{ const d={id:uid(),createdAt:T,name,colour,price:P}; rows.push(["dresses",d]); D[name]=d.id; });
  const B=(dress,client,ev,opts={})=>rows.push(["bookings",Object.assign({id:uid(),createdAt:T,status:"booked",dressId:D[dress],client,phone:"",eventDate:ev,pickup:addDays(ev,-1),return:addDays(ev,2),price:P,paid:P,notes:""},opts)]);
  // ticked in the stock list = out now
  B("Black House of CB","Liza",addDays(T,-1),{pickedUpAt:addDays(T,-2),paid:P});
  B("Brown Forever New","Kita",addDays(T,-1),{pickedUpAt:addDays(T,-2),paid:0});            // "Kita – R" in payments pending
  // names against unticked dresses = upcoming
  B("Pink Peppermayo","Ulrike","2026-10-02",{paid:0});
  B("Purple Forever New","Ulrike","2026-10-02",{paid:0});
  // payments pending with no dress recorded — dress is a guess for the demo
  B("Red Mango","Sophia",addDays(T,-10),{pickedUpAt:addDays(T,-11),returnedAt:addDays(T,-8),paid:P-300});
  B("Silver Mango","Quinne",addDays(T,-12),{pickedUpAt:addDays(T,-13),returnedAt:addDays(T,-10),paid:0});
  const E=(ev,client,dress,text)=>rows.push(["enquiries",{id:uid(),createdAt:T,client,phone:"",dressId:D[dress]||"",dressText:text||"",eventDate:ev}]);
  E("2026-10-03","Imke","Pink Peppermayo");
  E("2026-10-07","Liv","Black Oh Polly"); E("2026-10-07","Liv","Pink Peppermayo"); E("2026-10-07","Kayla","Pink Peppermayo");
  E("2026-10-07","Emma Bosma","Black House of CB"); E("2026-10-07","Kirsten","Black House of CB"); E("2026-10-07","Kara","Black House of CB");
  E("2026-10-09","Bella","Brown with scarf"); E("2026-10-09","Cara",null,"white fox blue");
  E("2026-10-10","Lize","Blue Zara"); E("2026-10-10","Lize","Pink Peppermayo"); E("2026-10-10","Phia","Blue Zara"); E("2026-10-10","Phia","Pink with scarf"); E("2026-10-10","Phia","Purple Forever New"); E("2026-10-10","Linki","Black House of CB");
  E("2026-10-15","Myra","Purple Forever New"); E("2026-10-15","Myra","Black House of CB"); E("2026-10-15","Minke","Pink with scarf"); E("2026-10-15","Minke",null,"olive green"); E("2026-10-15","Minke","Pink Peppermayo"); E("2026-10-15","Leani","Brown with scarf");
  E("2026-10-16","Emma Struwig","Brown with scarf");
  rows.push(["settings",{id:"main",address:"Christellahof Apartments, 57 Victoria Street",mapLink:"https://maps.app.goo.gl/hrYgowUqSgHjwJFi9?g_st=ic",payment:""}]);
  rows.forEach(([t,r])=>put(t,r));
  closeSheet(); go("today"); toast("Loaded from the notes");
}
/* ---------- boot ---------- */
if(!CONFIG.API_URL && !S.dresses.length) seedDresses(); else render();
loadAll();
window.addEventListener("online",flush);
document.addEventListener("visibilitychange",()=>{ if(!document.hidden) loadAll(); });
